name: Windows Local Beta Builder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextid-windows-local-beta
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out frozen private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: EpochTime-AI/ContextID
          ref: 195a7808ee9aa3ed98773ff7cdcdb9f4c7b4f362
          token: ${{ secrets.CONTEXTID_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: "11.11.0"
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            source/apps/desktop/go.sum
            source/services/core/go.sum
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Restore validated SQLCipher prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.cache/contextid/sqlcipher
          key: windows-local-beta-sqlcipher-4.16.0-openssl3-${{ hashFiles('source/infra/sqlcipher/**', 'source/scripts/sqlcipher/**') }}
      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          "C:\Program Files (x86)\NSIS" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make git autoconf automake libtool python curl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ripgrep
      - name: Install frozen workspace dependencies
        working-directory: source
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Verify Windows Native Host contract
        working-directory: source
        shell: pwsh
        run: ./scripts/install/browser-native-host-windows.contract.ps1
      - name: Verify Windows signing contract
        working-directory: source
        shell: pwsh
        run: |
          . ./scripts/release/windows-path-security.ps1
          $trustedRunnerTemp = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA (
            "ContextIDWindowsBeta-{0}" -f $env:GITHUB_RUN_ID
          )))
          $trustedRunnerTemp = New-ReleaseWindowsPrivateDirectory `
            -LiteralPath $trustedRunnerTemp `
            -FailureCode 'release_windows_contract_setup_failed'
          $previousRunnerTemp = $env:RUNNER_TEMP
          try {
            $env:RUNNER_TEMP = $trustedRunnerTemp
            ./scripts/release/platform-signing-windows.contract.ps1
          } finally {
            $env:RUNNER_TEMP = $previousRunnerTemp
            if (Test-Path -LiteralPath $trustedRunnerTemp -PathType Container) {
              Remove-Item -LiteralPath $trustedRunnerTemp -Recurse -Force
            }
          }
      - name: Prepare private Windows native root
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:RUNNER_TEMP (
            "contextid-windows-beta-{0}" -f $env:GITHUB_RUN_ID
          )
          if (Test-Path -LiteralPath $nativeRoot) {
            throw "windows_local_beta_native_root_exists"
          }
          $null = New-Item -ItemType Directory -Path $nativeRoot -ErrorAction Stop
          $current = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $system = [Security.Principal.SecurityIdentifier]::new("S-1-5-18")
          $security = [Security.AccessControl.DirectorySecurity]::new()
          $security.SetOwner($current)
          $security.SetAccessRuleProtection($true, $false)
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($sid in @($current, $system)) {
            $rule = [Security.AccessControl.FileSystemAccessRule]::new(
              $sid,
              [Security.AccessControl.FileSystemRights]::FullControl,
              $inheritance,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow
            )
            $security.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $nativeRoot -AclObject $security -ErrorAction Stop
      - name: Build and test Windows Local Beta
        working-directory: source
        shell: msys2 {0}
        run: |
          set -eu
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = 22
          go env GOVERSION | grep -Eq '^go1\.24(\.|$)'
          pnpm --version
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = 195a7808ee9aa3ed98773ff7cdcdb9f4c7b4f362
          registry=$(node --input-type=module <<'NODE'
          import {
            loadLocalBetaIdentityRegistry,
            toReleaseIdentityRegistry
          } from "./scripts/release/build-local-beta.mjs"

          const beta = await loadLocalBetaIdentityRegistry()
          process.stdout.write(JSON.stringify(toReleaseIdentityRegistry(beta)))
          NODE
          )
          export CONTEXTID_BROWSER_IDENTITIES_JSON="$registry"
          windows_temp="$(cygpath -w "$RUNNER_TEMP")"
          export TMP="$windows_temp"
          export TEMP="$windows_temp"
          unset TMPDIR
          native_root="$(cygpath -u "$RUNNER_TEMP")/contextid-windows-beta-$GITHUB_RUN_ID"
          test -d "$native_root"
          gocache="$native_root/go-build-cache"
          mkdir "$gocache"
          chmod 700 "$gocache"
          export GOCACHE="$(cygpath -w "$gocache")"
          policy="$native_root/browser-identities.json"
          node scripts/release/materialize-native-policy.mjs --output "$policy"

          ./scripts/verify/go-format-check.sh apps/desktop
          ./scripts/verify/go-format-check.sh services/core/client/localcore
          ./scripts/verify/go-format-check.sh services/core/cmd/contextid-local-core
          ./scripts/verify/go-format-check.sh services/core/cmd/contextid-browser-host
          pnpm run verify:desktop
          (cd apps/desktop && go test -count=1 ./... && go vet ./...)

          cache_root="$(cygpath -u "$GITHUB_WORKSPACE")/source/.cache/contextid/sqlcipher"
          ensure_output=$(scripts/sqlcipher/ensure-native-prefix.sh --cache-root "$cache_root")
          prefix=$(printf '%s\n' "$ensure_output" | sed -n 's/^PREFIX=//p' | tail -n 1)
          test -n "$prefix"
          vec_work="$native_root/sqlite-vec-work"
          vec_prefix="$native_root/sqlite-vec-prefix"
          pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$(cygpath -w scripts/sqlite-vec/build-native-windows.ps1)" \
            -WorkDir "$(cygpath -w "$vec_work")" \
            -Prefix "$(cygpath -w "$vec_prefix")" \
            -SqliteIncludeDir "$(cygpath -w "$prefix/include")"
          export PKG_CONFIG_PATH="$vec_prefix/lib/pkgconfig:$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          (
            cd services/core
            GOWORK=off go test -mod=readonly ./internal/securefile \
              -run '^TestWindowsReadSystemAllowsConcurrentAuthorizedReader$' -count=1
            GOWORK=off go test -mod=readonly ./internal/local/persistence/sqlite \
              -run '^TestWindowsPrivateDatabaseFileCreationDoesNotInheritLocalSystem$' -count=1
            GOWORK=off go test -mod=readonly -tags=contextid_sqlcipher \
              ./cmd/contextid-local-core \
              -run '^TestWindowsSystemKeyProviderCreatesFirstSpace$' -count=1
          )
          CONTEXTID_DESKTOP_SIDECAR_TMP_ROOT="$native_root" \
            CONTEXTID_SQLITE_VEC_PREFIX="$vec_prefix" CONTEXTID_BROWSER_IDENTITIES_FILE="$policy" \
            CONTEXTID_DESKTOP_NSIS=1 \
            make build-desktop SQLCIPHER_PREFIX="$prefix"
          make verify-desktop-e2e SQLCIPHER_PREFIX="$prefix"

          node apps/extension/scripts/build-browser.mjs build chrome --release
          node apps/extension/scripts/build-browser.mjs package chrome --release
          node apps/extension/scripts/build-browser.mjs build edge --release
          node apps/extension/scripts/build-browser.mjs package edge --release

          companion_root="$(cygpath -u "$RUNNER_TEMP")/contextid-companion-build"
          test ! -e "$companion_root"
          mkdir "$companion_root"
          pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$(cygpath -w scripts/build/companion-path-trust.ps1)" \
            -Mode ProtectPrivate -Path "$(cygpath -w "$companion_root")"
          companion_payload="$companion_root/payload"
          companion_output="$companion_root/output"
          mkdir "$companion_payload" "$companion_output"
          CONTEXTID_SQLCIPHER_PREFIX="$prefix" CONTEXTID_SQLITE_VEC_PREFIX="$vec_prefix" \
            CONTEXTID_BROWSER_IDENTITIES_FILE="$policy" \
            scripts/build/companion-payload.sh windows/amd64 "$companion_payload"
          scripts/build/companion-package.sh windows/amd64 "$companion_output" \
            --payload "$companion_payload"
          version=$(node -p 'require("./release/version.json").version')
          test -s "$companion_output/ContextID-Companion-$version-Windows-x64.exe"
      - name: Smoke installers and stage release bundle
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "release/version.json" -Raw |
            ConvertFrom-Json).version
          $desktopSource = Join-Path $env:GITHUB_WORKSPACE (
            "source\apps\desktop\build\bin\ContextID-amd64-installer.exe"
          )
          $companionSource = Join-Path $env:RUNNER_TEMP (
            "contextid-companion-build\output\ContextID-Companion-{0}-Windows-x64.exe" -f
              $version
          )
          foreach ($source in @($desktopSource, $companionSource)) {
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "windows_local_beta_installer_missing"
            }
            if ((Get-AuthenticodeSignature -LiteralPath $source).Status -cne "NotSigned") {
              throw "windows_local_beta_signature_state_invalid"
            }
          }

          function Write-InstallerState([string]$Phase) {
            Write-Host "WINDOWS_INSTALLER_STATE_BEGIN:$($Phase)"
            foreach ($root in @(
                (Join-Path $env:ProgramW6432 "ContextID"),
                (Join-Path $env:ProgramW6432 "EpochTime AI\ContextID")
              )) {
              Write-Host "STATE_ROOT:$($root):$(Test-Path -LiteralPath $root)"
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Force -Recurse -ErrorAction Continue |
                  ForEach-Object { Write-Host "STATE_ITEM:$($_.FullName)" }
              }
            }
            Get-ChildItem -LiteralPath $env:ProgramW6432 -Force -Directory `
              -Filter ".ContextIDCompanionTools-*" -ErrorAction Continue |
              ForEach-Object { Write-Host "STATE_TOOLS:$($_.FullName)" }
            foreach ($key in @(
                "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ContextIDCompanion",
                "HKLM:\Software\Google\Chrome\NativeMessagingHosts\com.contextid.browser",
                "HKLM:\Software\Microsoft\Edge\NativeMessagingHosts\com.contextid.browser"
              )) {
              Write-Host "STATE_REGISTRY:$($key):$(Test-Path -LiteralPath $key)"
            }
            Write-Host "WINDOWS_INSTALLER_STATE_END:$($Phase)"
          }

          function Invoke-Nsis(
            [string]$Path,
            [string]$Phase,
            [string[]]$Arguments = @("/S")
          ) {
            $process = Start-Process -FilePath $Path -ArgumentList $Arguments -Wait -PassThru
            Write-Host "WINDOWS_NSIS_RESULT:$($Phase):$($process.ExitCode)"
            if ($process.ExitCode -ne 0) {
              Write-InstallerState -Phase $Phase
              throw "windows_local_beta_nsis_failed:$($Phase):$($process.ExitCode)"
            }
          }
          function Invoke-ExternalUninstaller(
            [string]$Path,
            [string]$Phase,
            [string]$ProgramDirectory
          ) {
            $temporaryDirectory = Join-Path $env:RUNNER_TEMP (
              "contextid-windows-beta-uninstall-{0}" -f [Guid]::NewGuid().ToString("N")
            )
            $null = New-Item -ItemType Directory -Path $temporaryDirectory -ErrorAction Stop
            $copy = Join-Path $temporaryDirectory "Uninstall.exe"
            try {
              Copy-Item -LiteralPath $Path -Destination $copy -ErrorAction Stop
              Invoke-Nsis -Path $copy -Phase $Phase `
                -Arguments @("/S", "_?=$ProgramDirectory")
            } finally {
              if (Test-Path -LiteralPath $copy) { Remove-Item -LiteralPath $copy -Force }
              if (Test-Path -LiteralPath $temporaryDirectory) {
                Remove-Item -LiteralPath $temporaryDirectory -Force
              }
            }
          }

          $beta = Get-Content -LiteralPath "release/local-beta-browser-identities.json" -Raw |
            ConvertFrom-Json
          $companionProgram = Join-Path $env:ProgramW6432 "ContextID\Companion"
          Invoke-Nsis -Path $companionSource -Phase "companion_install"
          foreach ($name in @(
              "contextid-local-core.exe",
              "contextid-browser-host.exe",
              "contextid-agent.exe",
              "contextid-mcp.exe",
              "Uninstall.exe"
            )) {
            if (-not (Test-Path -LiteralPath (Join-Path $companionProgram $name) -PathType Leaf)) {
              throw "windows_local_beta_companion_payload_missing"
            }
          }
          node scripts/release/native-installed-smoke.mjs --browser chrome `
            --extension-id $beta.browsers.chrome.expected_id --scope system
          if ($LASTEXITCODE -ne 0) { throw "windows_local_beta_companion_smoke_failed" }

          # Run the same installed-payload verifier while maintenance is held,
          # but surface only its fixed, non-sensitive error code. The NSIS
          # transaction remains the authority and is still exercised below.
          $companionCore = Join-Path $companionProgram "contextid-local-core.exe"
          $maintenance = Start-Process -FilePath $companionCore `
            -ArgumentList @("maintenance", "begin") -Wait -PassThru
          if ($maintenance.ExitCode -ne 0) {
            throw "windows_local_beta_companion_diagnostic_maintenance_failed"
          }
          try {
            $diagnosticScript = Join-Path $companionProgram `
              "native-host\contextid-companion-uninstall.ps1"
            $pathTrustScript = Join-Path $env:GITHUB_WORKSPACE `
              "source\scripts\build\companion-path-trust.ps1"
            $diagnosticOutput = @(& powershell.exe -NoLogo -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass -File $diagnosticScript -Scope Machine `
              -PathTrustScript $pathTrustScript -VerifyProgramOnly 2>&1)
            $diagnosticExit = $LASTEXITCODE
            if ($diagnosticExit -ne 0) {
              $stableCode = @($diagnosticOutput | ForEach-Object { "$_" } |
                Where-Object { $_ -cmatch '^companion_[a-z0-9_]+$' } |
                Select-Object -Last 1)
              if ($stableCode.Count -ne 1) { $stableCode = @("companion_unknown") }
              throw "windows_local_beta_companion_preflight:$($stableCode[0])"
            }
          } finally {
            $maintenance = Start-Process -FilePath $companionCore `
              -ArgumentList @("maintenance", "end") -Wait -PassThru
            if ($maintenance.ExitCode -ne 0) {
              throw "windows_local_beta_companion_diagnostic_resume_failed"
            }
          }
          Invoke-ExternalUninstaller `
            -Path (Join-Path $companionProgram "Uninstall.exe") `
            -Phase "companion_uninstall" `
            -ProgramDirectory $companionProgram
          if (Test-Path -LiteralPath $companionProgram) {
            throw "windows_local_beta_companion_uninstall_residue"
          }

          $desktopProgram = Join-Path $env:ProgramW6432 "EpochTime AI\ContextID"
          Invoke-Nsis -Path $desktopSource -Phase "desktop_install"
          foreach ($name in @(
              "contextid-desktop.exe",
              "contextid-local-core.exe",
              "contextid-browser-host.exe",
              "native-host\browser-identities.json",
              "uninstall.exe"
            )) {
            if (-not (Test-Path -LiteralPath (Join-Path $desktopProgram $name) -PathType Leaf)) {
              throw "windows_local_beta_desktop_payload_missing"
            }
          }
          node scripts/release/native-installed-smoke.mjs --browser chrome `
            --extension-id $beta.browsers.chrome.expected_id --scope user
          if ($LASTEXITCODE -ne 0) { throw "windows_local_beta_desktop_smoke_failed" }
          Invoke-ExternalUninstaller `
            -Path (Join-Path $desktopProgram "uninstall.exe") `
            -Phase "desktop_uninstall" `
            -ProgramDirectory $desktopProgram
          if (Test-Path -LiteralPath $desktopProgram) {
            throw "windows_local_beta_desktop_uninstall_residue"
          }

          $output = Join-Path $env:RUNNER_TEMP "contextid-windows-local-beta"
          if (Test-Path -LiteralPath $output) { throw "windows_local_beta_output_exists" }
          $null = New-Item -ItemType Directory -Path $output -ErrorAction Stop
          $desktopName = "ContextID-{0}-Windows-x64-UNSIGNED.exe" -f $version
          $companionName = "ContextID-Companion-{0}-Windows-x64-Local-Beta-UNSIGNED.exe" -f $version
          $chromeName = "ContextID-Extension-{0}-Chrome-Local-Beta.zip" -f $version
          $edgeName = "ContextID-Extension-{0}-Edge-Local-Beta.zip" -f $version
          $sources = [ordered]@{
            $desktopName = $desktopSource
            $companionName = $companionSource
            $chromeName = (Join-Path $env:GITHUB_WORKSPACE "source\apps\extension\build\chrome-mv3-prod.zip")
            $edgeName = (Join-Path $env:GITHUB_WORKSPACE "source\apps\extension\build\edge-mv3-prod.zip")
          }
          $artifacts = @()
          foreach ($entry in $sources.GetEnumerator()) {
            $destination = Join-Path $output $entry.Key
            Copy-Item -LiteralPath $entry.Value -Destination $destination -ErrorAction Stop
            $digest = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $artifacts += [ordered]@{ name = $entry.Key; sha256 = $digest }
          }
          $manifest = [ordered]@{
            schema_version = 1
            product = "ContextID"
            version = $version
            git_sha = "195a7808ee9aa3ed98773ff7cdcdb9f4c7b4f362"
            channel = "local_beta"
            distribution = "public_prerelease"
            target = "windows/amd64"
            browsers = @("chrome", "edge")
            signing = "unsigned"
            cloud_sync = "disabled"
            desktop_installer = $desktopName
            companion_installer = $companionName
            chrome_extension_id = $beta.browsers.chrome.expected_id
            edge_extension_id = $beta.browsers.edge.expected_id
            artifacts = $artifacts
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText(
            (Join-Path $output "windows-local-beta-manifest.json"),
            ($manifest | ConvertTo-Json -Depth 8),
            $utf8
          )
          $instructions = @(
            "ContextID $version Windows x64 Local Beta",
            "",
            "完整桌面体验：安装 $desktopName，然后加载 Chrome 或 Edge 扩展包。",
            "仅使用浏览器插件：安装 $companionName，然后加载对应扩展包。",
            "",
            "扩展安装：解压 ZIP，在 chrome://extensions 或 edge://extensions 开启开发者模式，",
            "然后选择加载已解压的扩展程序。",
            "",
            "这是未签名预览版，Windows SmartScreen 可能提示未知发布者。",
            "仅在 SHA-256 与 windows-local-beta-manifest.json 一致时继续。",
            "云同步暂未启用；本轮只验收本地导入、检索、上下文召回和 Agent 连接。"
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
            (Join-Path $output "START-HERE-Windows.txt"),
            $instructions,
            $utf8
          )
      - name: Upload Windows Local Beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contextid-windows-local-beta-195a7808
          path: ${{ runner.temp }}/contextid-windows-local-beta/
          if-no-files-found: error
          retention-days: 14
