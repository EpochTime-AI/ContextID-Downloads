name: Windows Companion Security Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out frozen private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: EpochTime-AI/ContextID
          ref: 3588fd9b6ddb1e1bc7f7e5523b21a94eb350d1d3
          token: ${{ secrets.CONTEXTID_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.12.0 --yes --no-progress
      - name: Run exact trusted-tools initialization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "source"
          $payload = Join-Path $env:RUNNER_TEMP "contextid-minimal-payload"
          $native = Join-Path $payload "native-host"
          $output = Join-Path $env:RUNNER_TEMP "contextid-minimal-companion.exe"
          $null = New-Item -ItemType Directory -Path $native -ErrorAction Stop
          Copy-Item -LiteralPath (
            Join-Path $source "scripts\install\contextid-companion-uninstall.ps1"
          ) -Destination (Join-Path $native "contextid-companion-uninstall.ps1")
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $makensis /V4 `
            "-DVERSION=0.0.8" `
            "-DPAYLOAD_DIR=$payload" `
            "-DOUTPUT_FILE=$output" `
            "-DPATH_TRUST_SCRIPT=$(Join-Path $source 'scripts\build\companion-path-trust.ps1')" `
            (Join-Path $source "packaging\companion\windows\project.nsi")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "windows_companion_diagnostic_compile_failed"
          }
          $process = Start-Process -FilePath $output -ArgumentList "/S" -Wait -PassThru
          Write-Host "WINDOWS_COMPANION_DIAGNOSTIC_EXIT:$($process.ExitCode)"
          $base = Join-Path $env:ProgramW6432 "ContextID"
          Write-Host "WINDOWS_COMPANION_DIAGNOSTIC_BASE:$((Test-Path -LiteralPath $base))"
          if (Test-Path -LiteralPath $base -PathType Container) {
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File (Join-Path $source "scripts\build\companion-path-trust.ps1") `
              -Mode ProtectSystemParent -Path $base
            Write-Host "WINDOWS_COMPANION_DIAGNOSTIC_PARENT_TRUST_EXIT:$LASTEXITCODE"
            & "$env:WINDIR\System32\icacls.exe" $base
            $writeRights = [Security.AccessControl.FileSystemRights]::WriteData -bor
              [Security.AccessControl.FileSystemRights]::AppendData -bor
              [Security.AccessControl.FileSystemRights]::WriteAttributes -bor
              [Security.AccessControl.FileSystemRights]::WriteExtendedAttributes -bor
              [Security.AccessControl.FileSystemRights]::Delete -bor
              [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [Security.AccessControl.FileSystemRights]::TakeOwnership
            $ancestorRights = [Security.AccessControl.FileSystemRights]::Delete -bor
              [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [Security.AccessControl.FileSystemRights]::TakeOwnership
            foreach ($target in @($base, $env:ProgramW6432)) {
              $acl = Get-Acl -LiteralPath $target
              foreach ($rule in $acl.Access) {
                $sid = $rule.IdentityReference.Translate(
                  [Security.Principal.SecurityIdentifier]
                ).Value
                $raw = [int64]$rule.FileSystemRights
                $write = [int64]($rule.FileSystemRights -band $writeRights)
                $ancestor = [int64]($rule.FileSystemRights -band $ancestorRights)
                Write-Host "WINDOWS_COMPANION_DIAGNOSTIC_ACE:$target|$sid|$raw|$write|$ancestor|$($rule.InheritanceFlags)|$($rule.PropagationFlags)|$($rule.IsInherited)"
              }
            }
          }
          Get-ChildItem -LiteralPath $env:ProgramW6432 -Force -Directory `
            -Filter ".ContextIDCompanionTools-*" -ErrorAction Continue |
            ForEach-Object { Write-Host "WINDOWS_COMPANION_DIAGNOSTIC_TOOLS:$($_.FullName)" }
          if ($process.ExitCode -ge 100 -and $process.ExitCode -le 126) {
            throw "windows_companion_trusted_tools_phase_$($process.ExitCode)"
          }
          Write-Host "WINDOWS_COMPANION_TRUSTED_TOOLS_PASSED"
